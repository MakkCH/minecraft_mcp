plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}
repositories {
    ivy {
        url = 'https://github.com/grepsedawk/JsMacros/releases/download'
        patternLayout { artifact 'v[revision]/jsmacros-26.3-[revision]-fabric.[ext]' }
        metadataSources { artifact() }
        content { includeModule 'xyz.wagyourtail', 'jsmacros' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.9+ffef5f675d"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.2+fcdff87f5d"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.8+3434d6d95d"
    compileOnly "xyz.wagyourtail:jsmacros:${jsmacros_version}"
    runtimeOnly "xyz.wagyourtail:jsmacros:${jsmacros_version}"
}
sourceSets.main {
    java.srcDirs = ['mod/src/main/java']
    resources.srcDirs = ['mod/src/main/resources']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    runs {
        client {
            runDir = project.findProperty('mcpRunDir') ?: "${System.getProperty('java.io.tmpdir')}/minecraft-mcp-dev"
        }
    }
}
